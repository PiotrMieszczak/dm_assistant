name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    # Skip comments that are not on a pull request.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Z.AI GLM through LiteLLM. Add ZAI_KEY in
          # Settings → Secrets and variables → Actions.
          ZAI__KEY: ${{ secrets.ZAI_KEY }}

          # Model id is a repository variable, not a secret, so it can be
          # changed without touching this file. Set PR_AGENT_MODEL under
          # Settings → Secrets and variables → Actions → Variables.
          # Falls back to glm-4.5-flash, the id LiteLLM documents today.
          CONFIG__MODEL: ${{ vars.PR_AGENT_MODEL || 'zai/glm-4.5-flash' }}
          CONFIG__FALLBACK_MODELS: '["zai/glm-4.5-flash"]'

          # LiteLLM does not carry a context window for every GLM id, so
          # state it explicitly rather than letting the call fail.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"

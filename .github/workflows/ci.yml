name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # frontend/ does not exist on every branch yet. Skip rather than fail.
      - id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/ on this ref — skipping build, test, and lint."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm test

      # Build last: typecheck runs here (tsc -b), so lint and test failures
      # surface first and faster.
      - name: Build
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
